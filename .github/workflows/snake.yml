name: Generate Contribution Snake

on:
  # Run automatically every day
  schedule:
    - cron: "0 0 * * *"

  # Allow manual runs from the Actions tab
  workflow_dispatch:

  # Also regenerate when this workflow changes
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: srikrishna-uddala

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FFB7D5&color_dots=#0D1117,#291B2C,#6F2D5C,#D16BA5,#F8BBD0
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFB7D5&color_dots=#0D1117,#291B2C,#6F2D5C,#D16BA5,#F8BBD0

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
